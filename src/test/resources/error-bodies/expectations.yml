# Error-body fixtures of design card 10: real error responses of 13 stacks plus RFC 9457 problem details.
# express-conduit holds 500 bodies of the RealWorld node-express implementation captured by the live check.
# Captured from small reference apps (cats_research benchmarks/error-bodies: apps/, capture.py, assemble.py), from
# rest-ncs and features-service (WFD 4.3.0) and from the card-11 exports. Local paths were rewritten to /app-style
# container paths and Django's environment dump was cut. Entries with derived: true reorder the messages of the
# captured body by hand, as validators that report violations in hash order do.
# custom-envelopes holds hand-written bodies (all derived: true) of custom JSON error envelopes: code-like error types,
# several message fields, nested error objects, parallel code/message arrays and unusual field names.
#
#   group       same group => same errorTemplateId when a stack's fixtures are mined together; different => different
#   expect      the extracted error type, the masked message tokens (joined by spaces) and the crash-site frame
- file: aspnet/validation-one-field.json
