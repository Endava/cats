  request:
    url: /users
    payload: '{"name": "bob", "email": "bob@example.com", "age": -1}'
  group: one-field
  expect:
    errorType: One or more validation errors occurred.
    tokens: 'Age: The field Age must be between NUM and NUM.'
    stackFrame: ''
