openapi: 3.0.3
info:
  title: Shared variant with same discriminator property name and different mapping keys
  version: 1.0.0
paths: { }
components:
  schemas:
    Shape:
      properties:
        type:
          type: string
      oneOf:
        - $ref: '#/components/schemas/BigCircleShape'
        - $ref: '#/components/schemas/SmallSquareShape'
      discriminator:
        propertyName: type
        mapping:
          BIG_CIRCLE: '#/components/schemas/BigCircleShape'
          SMALL_SQUARE: '#/components/schemas/SmallSquareShape'
    Icon:
      properties:
        type:
          type: string
      oneOf:
        - $ref: '#/components/schemas/BigCircleShape'
        - $ref: '#/components/schemas/WarningIcon'
      discriminator:
        propertyName: type
        mapping:
          CIRCLE_ICON: '#/components/schemas/BigCircleShape'
          WARNING_ICON: '#/components/schemas/WarningIcon'
    BigCircleShape:
      type: object
      required: [ type, radius ]
      properties:
        type:
          type: string
        radius:
          type: integer
    SmallSquareShape:
      type: object
      required: [ type, side ]
      properties:
        type:
          type: string
        side:
          type: integer
    WarningIcon:
      type: object
      required: [ type, color ]
      properties:
        type:
          type: string
        color:
          type: string
