openapi: 3.0.3
info:
  title: Partial mapping casing detection per union
  version: 1.0.0
paths: { }
components:
  schemas:
    Vehicle:
      properties:
        type:
          type: string
      oneOf:
        - $ref: '#/components/schemas/SportsCarVehicle'
      discriminator:
        propertyName: type
        mapping:
          SPORTS_CAR: '#/components/schemas/SportsCarVehicle'
    SportsCarVehicle:
      type: object
      required: [ type, topSpeed ]
      properties:
        type:
          type: string
        topSpeed:
          type: integer
    Shape:
      properties:
        type:
          type: string
      oneOf:
        - $ref: '#/components/schemas/BigCircleShape'
        - $ref: '#/components/schemas/SmallSquareShape'
      discriminator:
        propertyName: type
        mapping:
          big-circle: '#/components/schemas/BigCircleShape'
    BigCircleShape:
      type: object
      required: [ type, radius ]
      properties:
        type:
          type: string
        radius:
          type: integer
    SmallSquareShape:
      type: object
      required: [ type, side ]
      properties:
        type:
          type: string
        side:
          type: integer
