# Example headers file (pass with: --headers files/headers.yml)
# Supports 'all', wildcard path prefixes ('/pets*'), HTTP method scoping ('POST /pets'),
# environment variables ('$$API_TOKEN'), and dynamic shorthands ('#(uuid)').
all:
  Authorization: "Bearer $$API_TOKEN"
  X-Correlation-Id: "#(uuid)"

"/pets*":
  X-Clinic-Region: "EU"

"POST /pets":
  X-Idempotency-Key: "#(uuid)"
  API-Key: "123"
