name: GraalVM Native Image builds on All platforms
on:
  workflow_dispatch:
    inputs:
      releaseversion:
        description: 'Release version'
        required: true
        default: 'X.X.X'

jobs:
  release:
    name: Creating Release for CATS ${{ github.event.inputs.releaseversion }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: cats-${{ github.event.inputs.releaseversion }}

      - name: Get Previous Tag
        id: get_previous_tag
        run: |
          PREVIOUS_TAG=$(git tag --sort=-v:refname | grep -E '^cats-[0-9]+\.[0-9]+(\.[0-9]+)?$' | grep -v "cats-${{ github.event.inputs.releaseversion }}" | head -n 1)
          echo "PREVIOUS_TAG=$PREVIOUS_TAG"
          echo "PREVIOUS_TAG=$PREVIOUS_TAG" >> "$GITHUB_ENV"

      - name: Generate Changelog
        id: generate_changelog
        run: |
          echo "Generating changelog from ${{ env.PREVIOUS_TAG }} to ${{ github.ref_name }}"
          CHANGELOG=$(git log "${{ env.PREVIOUS_TAG }}..cats-${{ github.event.inputs.releaseversion }}" --pretty=format:"* %s" --no-merges | grep -vE "\[maven-release-plugin\]|chore:|docs:|test:|ci:|build:" || true)
          {
            echo "CHANGELOG<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Create GitHub Release
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "cats-${{ github.event.inputs.releaseversion }}" \
            --title "cats-${{ github.event.inputs.releaseversion }}" \
            --notes "$CHANGELOG"

  build_uberjar:
    name: Building CATS uberjar for release ${{ github.event.inputs.releaseversion }}
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          ref: cats-${{ github.event.inputs.releaseversion }}

      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Uberjar
        run: |
          ./mvnw -B clean package --file pom.xml -Dquarkus.package.type=uber-jar -DskipTests=true

      - name: Tar jar file
        run: |
          cp target/cats-runner.jar cats.jar
          tar -czf cats_uberjar_${{ github.event.inputs.releaseversion }}.tar.gz cats.jar

      - name: Upload Uberjar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "cats-${{ github.event.inputs.releaseversion }}" \
            "cats_uberjar_${{ github.event.inputs.releaseversion }}.tar.gz" \
            --clobber

  build:
    name: Building CATS on ${{ matrix.os }} for release ${{ github.event.inputs.releaseversion }}
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ macos-15, macos-15-intel, windows-2025, ubuntu-24.04, ubuntu-24.04-arm ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          ref: cats-${{ github.event.inputs.releaseversion }}

      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine OS and Architecture
        id: determine_os_arch
        shell: bash
        run: |
          if [[ "${{ runner.arch }}" == "ARM64" ]]; then
            echo "OS_ARCH=arm64" >> "$GITHUB_ENV"
          else
            echo "OS_ARCH=amd64" >> "$GITHUB_ENV"
          fi
          runner_os=$(echo "${{ matrix.os }}" | sed -e 's/-.*$//' -e 's/ubuntu/linux/')
          echo "RUNNER_OS=$runner_os" >> "$GITHUB_ENV"

      - name: Build and run CATS
        run: |
          ./mvnw -B clean package --file pom.xml -Pnative -DskipTests=true

      - name: Tar files for Linux and MacOS
        if: "!startsWith(matrix.os, 'windows')"
        run: |
          cp target/cats-runner cats
          ASSET_FILE="cats_${{ env.RUNNER_OS }}_${{ env.OS_ARCH }}_${{ github.event.inputs.releaseversion }}.tar.gz"
          tar -czf "$ASSET_FILE" cats
          echo "ASSET_FILE=$ASSET_FILE" >> "$GITHUB_ENV"

      - name: Zip file for Windows
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          copy target\cats-runner.exe cats.exe
          $assetFile = "cats_${{ env.RUNNER_OS }}_${{ env.OS_ARCH }}_${{ github.event.inputs.releaseversion }}.zip"
          Compress-Archive -Path cats.exe -Destination $assetFile
          "ASSET_FILE=$assetFile" >> $env:GITHUB_ENV

      - name: Upload Release Asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "cats-${{ github.event.inputs.releaseversion }}" "${{ env.ASSET_FILE }}" --clobber
